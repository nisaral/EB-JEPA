name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Full test suite
        run: python -m pytest -q -rs
      - name: Heuristic harness smoke test (no weights)
        run: python scripts/ci_smoke.py

  pretrained-smoke:
    name: pretrained smoke (HF soro-kev-0.8b, CPU)
    runs-on: ubuntu-latest
    needs: test
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-soro-kev-0.8b-qwen-v1
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Pretrained smoke test (skips if the Hub is unreachable)
        env:
          SORO_RUN_PRETRAINED: "1"
        run: python -m pytest tests/test_pretrained_smoke.py -q -rs
