name: Bug report
description: Something is broken or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A minimal snippet (tools + query) that reproduces it, and what you expected.
      render: python
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`soro-boro doctor` output"
      render: text
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model / backend
      options: [soro-kev-0.8b, soro-kev-4b, heuristic, custom scorer]
  - type: input
    id: version
    attributes:
      label: soro-boro version
      placeholder: "python -c 'import soro_boro; print(soro_boro.__version__)'"
