[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soro-boro"
version = "0.2.1"
description = "Soro-Kev: Calibration-Aware System-One Tool Router (4B & 0.8B) on Qwen3 Decision Models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "torch>=2.0",
  "transformers>=4.40",
  "peft>=0.10.0",
  "safetensors>=0.4.0",
  "huggingface-hub>=0.20",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "numpy>=1.24",
]

[project.optional-dependencies]
# HTTP server: `soro-boro serve`
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
# gRPC / protobuf transport used by soro.framework
grpc = [
  "protobuf>=4.25",
  "grpcio>=1.60",
]
# Gradio demo app
demo = [
  "gradio>=4.0",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "protobuf>=4.25",
  "grpcio>=1.60",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  "soro-boro[test]",
  "pre-commit>=3.5",
  "ruff>=0.5",
]
all = [
  "soro-boro[server,grpc,demo,test]",
]

[project.scripts]
soro = "soro.cli:main"
soro-audit = "soro.cli_audit:main"
soro-boro = "soro_boro.cli:main"

[tool.setuptools.packages.find]
where = ["veyra/python/src"]

[tool.setuptools.package-data]
"soro" = ["dashboard.html"]
"soro.v1" = ["*.pyi"]

[tool.pytest.ini_options]
testpaths = ["veyra/python/tests", "veyra/tests", "tests"]
addopts = "-p no:cacheprovider"
markers = [
  "network: needs internet access (Hugging Face Hub downloads)",
  "slow: loads real model weights",
]
